name: "godot-ci export"
on: push

# NOTE: If your `project.godot` is at the repository root, set `PROJECT_PATH` below to ".".

env:
  GODOT_VERSION: 4.7
  GODOT_FULL_VERSION: 4.7.2-stable
  EXPORT_NAME: DwarfTossing
  PROJECT_PATH: .

jobs:
  export-windows:
    name: Windows Export
    runs-on: blacksmith-4vcpu-windows-2025  # Use 24.04 with godot 4
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@v1
        with:
          lfs: true

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download Godot .NET and Export Templates
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $BaseUrl = "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_FULL_VERSION }}"
          
          # Download Godot Engine
          Invoke-WebRequest -Uri "$BaseUrl/Godot_v${{ env.GODOT_FULL_VERSION }}_mono_win64.zip" -OutFile "godot.zip"
          Expand-Archive -Path "godot.zip" -DestinationPath "C:\godot"
          
          # Move Godot binary and GodotSharp folder to C:\godot
          $GodotFolder = Get-ChildItem -Path "C:\godot" -Directory | Select-Object -First 1
          Move-Item -Path "$($GodotFolder.FullName)\*" -Destination "C:\godot" -Force
          
          # Download Export Templates
          Invoke-WebRequest -Uri "$BaseUrl/Godot_v${{ env.GODOT_FULL_VERSION }}_mono_export_templates.tpz" -OutFile "templates.zip"
          
          # Convert "4.7.2-stable" -> "4.7.2.stable" for the template directory name
          $TemplateVersion = "${{ env.GODOT_FULL_VERSION }}" -replace '-', '.'
          $TemplateDir = "$env:APPDATA\Godot\export_templates\$TemplateVersion.mono"
          
          New-Item -ItemType Directory -Path $TemplateDir -Force
          Expand-Archive -Path "templates.zip" -DestinationPath "$env:TEMP\templates"
          Move-Item -Path "$env:TEMP\templates\templates\*" -Destination $TemplateDir -Force

      - name: Export Windows Build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "build\windows" -Force
          
          # Prevent .NET from spawning lingering background compiler daemons
          $env:UseSharedCompilation = "false"
          $env:DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER = "1"
          
          & "C:\godot\Godot_v${{ env.GODOT_FULL_VERSION }}_mono_win64_console.exe" --headless --export-release "Windows Desktop" "build\windows\${{ env.GAME_NAME }}.exe"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.GAME_NAME }}-Windows
          path: build/windows/

  export-linux:
    name: Linux Export
    runs-on: blacksmith-4vcpu-ubuntu-2404  # Use 24.04 with godot 4
    container:
      image: barichello/godot-ci:mono-4.7
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@v1
        with:
          lfs: true
      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono
      - name: Linux Build
        run: |
          mkdir -v -p build/linux
          EXPORT_DIR="$(readlink -f build)"
          cd $PROJECT_PATH
          godot --headless --verbose --export-release "Linux" "$EXPORT_DIR/linux/$EXPORT_NAME.x86_64"
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/linux
